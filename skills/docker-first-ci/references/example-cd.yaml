# OPTIONAL variant. Use it only when deployment must be a separate, separately
# approvable workflow. By default CI pushes the image itself.
#
# It needs CI (named "CI") to end its build job on push events with:
#   - run: docker save "${IMAGE_NAME}:${IMAGE_TAG}" -o image.tar
#   - uses: actions/upload-artifact@v7
#     with: { name: docker-image, path: image.tar, retention-days: 1 }
# where IMAGE_TAG is the commit SHA, set through env on the build step.
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/example-org/example-service

jobs:
  publish:
    # Only successful CI runs triggered by a push; never a pull request.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production # add required reviewers here for an approval gate
    permissions:
      contents: read
      packages: write
      actions: read # needed to download an artifact from another run
    # The CI run's values reach the script through env, never pasted into it.
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load the image CI built and tested
        run: docker load -i image.tar

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main publishes latest; every branch gets a tag from its own name.
      - name: Push the same image
        run: |
          safe_branch="${HEAD_BRANCH//\//-}"
          docker tag "${IMAGE_NAME}:${HEAD_SHA}" "${IMAGE_NAME}:${safe_branch}"
          docker push "${IMAGE_NAME}:${safe_branch}"
          if [ "${HEAD_BRANCH}" = "main" ]; then
            docker tag "${IMAGE_NAME}:${HEAD_SHA}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          fi
