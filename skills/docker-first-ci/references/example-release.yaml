# Artifact shape. Started by hand; pushing a tag starts nothing. The release is
# left as a draft so a person reads it and publishes it.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The input reaches every script through this variable, never by being
      # pasted into a script's text.
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag format
        run: |
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'ERROR: tag must look like v1.2.3, got: %s\n' "${TAG}" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }} # a name that is not a tag fails the run
          fetch-depth: 0
          # gh uses GH_TOKEN, so the write token need not sit in .git/config.
          persist-credentials: false

      # The release passes the same gates and e2e tests as CI, on this commit.
      - name: Build and test
        run: BUILD_VER="${TAG}" ./build/build.sh

      - name: Check the binary reports the tag
        run: |
          version_output="$(dist/amd64/linux/example-tool --version)"
          if ! printf '%s\n' "${version_output}" | grep -Fxq "example-tool version: ${TAG}"; then
            printf 'ERROR: the binary reports %s, not %s\n' "${version_output}" "${TAG}" >&2
            exit 1
          fi

      # build/package.sh (not shown) takes BUILD_VER, checks every input before
      # writing anything, builds one archive per platform plus checksums.txt in a
      # temp dir, and moves them into .dist/ only when all exist.
      - name: Package the archives
        run: BUILD_VER="${TAG}" ./build/package.sh

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" --draft --verify-tag --generate-notes .dist/*
